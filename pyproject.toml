[project]
name = "jsb-doctrinal-timeline"
version = "0.1.0"
description = "Provenance-grade doctrinal principle extraction from Joseph Smith Papers"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "edtf>=5.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.0.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic-settings>=2.14.1",
    "google-genai>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "hypothesis>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C90"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
